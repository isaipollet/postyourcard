[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://postyourcard.netlify.app/*"
  to = "https://postyourcard.com/:splat"
  status = 301
  force = true

# Scheduled functions — replace Vercel cron jobs.
# Schedules are UTC.
[functions."cron-reconcile"]
  schedule = "0 6 * * *"

[functions."cron-cleanup-images"]
  schedule = "0 3 * * *"

# Daily print batch to the printer — 15:30 UTC = 17:30 Brussels (summer).
[functions."cron-print-batch"]
  schedule = "30 15 * * *"
